name: Reusable Dependency Audit

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      audit-level:
        description: "Minimum vulnerability level to fail on (low, moderate, high, critical)"
        required: false
        type: string
        default: "high"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Node.js Environment Setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Dependency Audit Execution
        run: npm audit --audit-level=${{ inputs.audit-level }}
