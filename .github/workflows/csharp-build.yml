name: Reusable C# Build

on:
  workflow_call:
    inputs:
      project_path:
        description: "The path to the C# project or solution file (e.g., src/App.slnx)"
        required: false
        default: "."
        type: string
      dotnet_version:
        description: "The .NET SDK version to use (e.g., 10.0.x)"
        required: false
        default: "10.0.x"
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore Dependencies
        run: dotnet restore "${{ inputs.project_path }}"

      - name: Build (Release)
        run: dotnet build "${{ inputs.project_path }}" --configuration Release --no-restore

      - name: Build (Debug)
        run: dotnet build "${{ inputs.project_path }}" --configuration Debug --no-restore
